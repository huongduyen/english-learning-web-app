name: Production CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ============================================================================
  # 1. Backend Pipeline (Lint, Typecheck, Unit Tests, Integration Tests, Build)
  # ============================================================================
  backend-checks:
    name: Backend CI (Lint, Typecheck, Tests & Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'english_learning_db' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/english_learning_db?schema=public' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-testing-jwt-secret-key-32-chars-long' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-testing-jwt-refresh-secret-key-32-chars-long' }}
      PORT: 3000
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 1. Install Backend Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma Migrations
        run: npx prisma migrate deploy

      - name: Seed Initial Learning Data
        run: npm run prisma:seed

      - name: 2. Run Backend Lint
        run: npm run lint

      - name: 3. Run Backend TypeScript Checks
        run: npm run typecheck

      - name: 4. Run Backend Unit Tests
        run: npm run test

      - name: 5. Run Backend Integration (E2E) Tests
        run: npm run test:e2e

      - name: 7. Build Backend
        run: npm run build

  # ============================================================================
  # 2. Frontend Pipeline (Lint, Typecheck, Unit Tests, Build)
  # ============================================================================
  frontend-checks:
    name: Frontend CI (Lint, Typecheck, Unit Tests & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:3000/api/v1' }}
      VITE_APP_NAME: "English Learning Platform"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 1. Install Frontend Dependencies
        run: npm ci

      - name: 2. Run Frontend Lint
        run: npm run lint

      - name: 3. Run Frontend TypeScript Checks
        run: npm run typecheck

      - name: 4. Run Frontend Unit Tests
        run: npm run test

      - name: 6. Build Frontend
        run: npm run build

  # ============================================================================
  # 3. End-to-End (E2E) Browser Pipeline (Playwright)
  # ============================================================================
  playwright-e2e:
    name: 8. Playwright Browser E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'english_learning_db' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/english_learning_db?schema=public' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-testing-jwt-secret-key-32-chars-long' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-testing-jwt-refresh-secret-key-32-chars-long' }}
      PORT: 3000
      CORS_ORIGIN: "http://localhost:5173"
      VITE_API_BASE_URL: "http://localhost:3000/api/v1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Backend & Database
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Launch Backend in Background
        working-directory: backend
        run: |
          npm run start:dev &
          npx wait-on http://localhost:3000/api/v1/health --timeout 60000

      - name: Install Frontend & Playwright Browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Tests
        working-directory: frontend
        env:
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
